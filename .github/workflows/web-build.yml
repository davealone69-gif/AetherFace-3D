name: AetherFace web build

on:
  push:
    branches:
      - feature/studio-repair-autostart-2026-11-02
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aetherface-web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate required app files and HTML references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          root = Path('.')
          required = [
              'index.html', 'manifest.webmanifest', 'start.py',
              'start.sh', 'start.bat', 'assets/aetherface-icon.svg'
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))

          html = (root / 'index.html').read_text(encoding='utf-8')
          class Checker(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)
          Checker().feed(html)

          refs = re.findall(r'''(?:src|href)=["']([^"']+)["']''', html)
          local = [r.split('#', 1)[0].split('?', 1)[0] for r in refs
                   if r and not r.startswith(('http://', 'https://', 'data:', '#', 'mailto:'))]
          missing_refs = [r for r in local if r and not (root / r).exists()]
          if missing_refs:
              raise SystemExit('Broken local HTML references: ' + ', '.join(missing_refs))
          print('PASS: required files, HTML parsing, and local references')
          PY

      - name: Check active inline JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.external = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.active = True
                      self.external = any(key == 'src' for key, _ in attrs)
                      self.parts = []
              def handle_data(self, data):
                  if self.active and not self.external:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.active:
                      source = ''.join(self.parts).strip()
                      if source:
                          self.scripts.append(source)
                      self.active = False
                      self.external = False

          parser = InlineScripts()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          if not parser.scripts:
              raise SystemExit('No active inline JavaScript found in index.html')
          for index, source in enumerate(parser.scripts):
              Path(f'/tmp/aetherface-inline-{index}.js').write_text(source, encoding='utf-8')
          print(f'Extracted {len(parser.scripts)} active inline script(s)')
          PY
          for script in /tmp/aetherface-inline-*.js; do
            node --check "$script"
          done

      - name: Smoke-test server and automatic port fallback
        run: |
          set -euo pipefail
          python start.py --no-open > /tmp/aetherface-default.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" "${BLOCKER_PID:-}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/ -o /tmp/aetherface-index.html; then
              break
            fi
            sleep 1
          done
          grep -q 'AETHERFACE' /tmp/aetherface-index.html
          grep -q 'running at http://127.0.0.1:8080/' /tmp/aetherface-default.log
          curl --fail --silent http://127.0.0.1:8080/manifest.webmanifest -o /dev/null
          curl --fail --silent http://127.0.0.1:8080/assets/aetherface-icon.svg -o /dev/null
          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true
          python - <<'PY' &
          import socket, time
          blocker = socket.socket()
          blocker.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          blocker.bind(('127.0.0.1', 8080))
          blocker.listen()
          time.sleep(45)
          PY
          BLOCKER_PID=$!
          sleep 1
          python start.py --no-open > /tmp/aetherface-fallback.log 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8001/ -o /tmp/aetherface-fallback-index.html; then
              break
            fi
            sleep 1
          done
          grep -q 'AETHERFACE' /tmp/aetherface-fallback-index.html
          grep -q 'Port 8080 is already in use' /tmp/aetherface-fallback.log
          echo 'PASS: default server uses 8080; occupied 8080 falls back to 8001'
      - name: Package distributable
        run: |
          mkdir -p dist
          zip -qr dist/AetherFace-3D-Studio-web.zip . \
            -x '.git/*' '.github/*' 'dist/*' '.DS_Store'
          test -s dist/AetherFace-3D-Studio-web.zip
          sha256sum dist/AetherFace-3D-Studio-web.zip | tee dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherFace-3D-Studio-web
          path: |
            dist/AetherFace-3D-Studio-web.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
